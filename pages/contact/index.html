<body>

  <header class="siteHeader">
    <div class="brand">
      <a class="brandName" href="../../index.html">DMDA//NET</a>
      <span class="brandTag">Future Software Engineer</span>
    </div>
    <button class="menuToggle" aria-label="Toggle navigation">Menu</button>
    <nav class="mainNav" aria-label="Main">
      <a href="../../index.html">Home</a>
      <a href="../../pages/about/index.html">About</a>
      <a href="../../pages/skillsProjects/index.html">Skills &amp; Projects</a>
      <a class="isActive" href="../../pages/contact/index.html">Contact</a>
    </nav>
  </header>

  <main class="pageSection">
    <h1 class="sectionTitle reveal" data-parallax="0.04">Get in Touch</h1>
    <p class="sectionSub reveal">&gt; Open a channel</p>

    <div class="contactLayout">
      <form id="contactForm" class="panel formPanel reveal" novalidate>
        <div class="formRow">
          <div class="field">
            <label for="name">Your Name <span class="req">*</span></label>
            <input id="name" name="name" type="text" autocomplete="name">
            <span class="errorText"></span>
          </div>
          <div class="field">
            <label for="email">Your Email <span class="req">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email">
            <span class="errorText"></span>
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
          <span class="errorText"></span>
        </div>

        <div class="field">
          <label for="message">Message <span class="req">*</span></label>
          <textarea id="message" name="message" rows="5"></textarea>
          <span class="errorText"></span>
        </div>

        <div class="formActions">
          <button class="btnCyber" type="submit">Send Message</button>
          <span id="formStatus" class="formStatus" role="status" aria-live="polite"></span>
        </div>
      </form>

      <aside class="panel infoPanel reveal">
        <p class="panelLabel">Direct line:</p>
        <div class="infoItem"><span>Call</span>0916 263 1733</div>
        <div class="infoItem"><span>Write</span><a href="mailto:erizziad@gmail.com">erizziad@gmail.com</a></div>
        <div class="infoItem"><span>Follow</span><a href="https://github.com/DukeErizzia" target="_blank" rel="noopener">github.com/DukeErizzia</a></div>
      </aside>
    </div>
  </main>

  <footer class="siteFooter">
    <div class="footGroup">
      <div class="footBlock"><span>Call</span>0916 263 1733</div>
      <div class="footBlock"><span>Write</span>erizziad@gmail.com</div>
    </div>
    <div class="footBlock"><span>Follow</span><a href="https://github.com/DukeErizzia" target="_blank" rel="noopener">github.com/DukeErizzia</a></div>
  </footer>

  <script src="../../assets/js/script.js"></script>
  <script src="assets/js/contact.js"></script>

</body>
</html>
